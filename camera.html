<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Take Attendance - Live Scan</title>
    <link rel="stylesheet" href="static/style.css?v=20260430c">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        (function() {
            const isLocalHost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            const defaultRenderUrl = 'https://smart-attendance-management-system-fbqm.onrender.com';
            let savedUrl = localStorage.getItem('API_BASE_URL');
            if (!isLocalHost && savedUrl && (savedUrl.includes('localhost') || savedUrl.includes('127.0.0.1') || savedUrl.startsWith('http:'))) {
                localStorage.removeItem('API_BASE_URL');
                savedUrl = null;
            }
            window.API_BASE_URL = window.API_BASE_URL || savedUrl || defaultRenderUrl;
        })();
    </script>
    <style>
        .client-camera video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: inherit;
            transform: scaleX(-1);
        }
        .scan-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border: 4px solid transparent;
            border-radius: inherit;
            pointer-events: none;
            transition: border-color 0.3s, box-shadow 0.3s;
            z-index: 3;
        }
        .scan-overlay.active {
            border-color: #2ecc71;
            box-shadow: inset 0 0 30px rgba(46, 204, 113, 0.3);
        }
        .scan-overlay.error {
            border-color: #e74c3c;
            box-shadow: inset 0 0 30px rgba(231, 76, 60, 0.3);
        }
        #video {
            display: block;
            width: 100%;
            height: 100%;
        }
        .live-log-box {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            max-height: 140px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div class="guest-view text-slate-800 antialiased min-h-screen overflow-x-hidden pb-10">
        <main class="camera-shell" style="background:transparent;max-width:680px;margin:0 auto;padding:24px;position:relative;z-index:10;">
            <div class="flex justify-between items-start mb-6">
                <div>
                    <p class="text-blue-600 font-bold text-xs tracking-wide uppercase">Attendance Verification</p>
                    <h1 class="text-xl font-extrabold text-slate-900 mt-1">Look straight at the camera</h1>
                </div>
                <a href="index.html" class="ultra-glass-btn flex items-center gap-2 px-4 py-2 rounded-full shadow-sm active:scale-95 transition-transform duration-200 text-sm font-semibold text-slate-700">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
                    Back
                </a>
            </div>

            <section class="camera-stage ultra-glass" style="border-radius:2rem;overflow:hidden;" id="cameraStage">
            <div class="countdown-timer" id="countdown">10</div>
            <div class="camera-ring client-camera">
                <video id="video" autoplay playsinline muted></video>
                <canvas id="canvas" style="display:none;"></canvas>
                <div class="face-guide"></div>
                <div class="scan-overlay" id="scanOverlay"></div>
            </div>
            <div class="camera-overlay" id="processingOverlay">
                <div class="processing-card">
                    <div class="processing-spinner"></div>
                    <h2>Marking Attendance</h2>
                    <p>Saving attendance record to database...</p>
                </div>
            </div>
            <div class="camera-status" id="statusMessage">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
                <span>Initializing camera...</span>
            </div>

            <!-- Error Banner -->
            <div id="errorBanner" class="hidden mx-6 mt-4 p-3 bg-red-100 border border-red-300 rounded-xl text-red-700 text-xs font-semibold flex items-center justify-between">
                <span id="errorBannerText">Error</span>
                <button onclick="document.getElementById('errorBanner').classList.add('hidden')" class="text-red-500 font-bold ml-2">✕</button>
            </div>

            </section>
        </main>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const statusEl = document.getElementById('statusMessage');
        const countdownEl = document.getElementById('countdown');
        const scanOverlay = document.getElementById('scanOverlay');
        const cameraStage = document.getElementById('cameraStage');
        const overlayEl = document.getElementById('processingOverlay');
        const logBox = document.getElementById('logBox');
        const errorBanner = document.getElementById('errorBanner');
        const errorBannerText = document.getElementById('errorBannerText');

        let stream = null;
        let frameInterval = null;
        let isProcessing = false;
        let secondsLeft = 10;
        let matchFound = false;
        let voteCounter = {};
        let totalChecks = 0;
        let noFaceCount = 0;

        const apiTag = document.getElementById('backendApiTag');
        if (apiTag) apiTag.textContent = API_BASE_URL.replace('https://', '').split('.')[0];

        function addLog(msg, type = 'info') {
            console.log(`[${type.toUpperCase()}] ${msg}`);
            if (!logBox) return;
            const time = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            if (type === 'error') div.className = 'text-red-400 font-bold';
            else if (type === 'success') div.className = 'text-emerald-400 font-bold';
            else if (type === 'warn') div.className = 'text-amber-300';
            else div.className = 'text-slate-300';

            div.textContent = `[${time}] ${msg}`;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function showError(msg) {
            errorBannerText.textContent = msg;
            errorBanner.classList.remove('hidden');
            addLog(`❌ ERROR: ${msg}`, 'error');
        }

        async function startCamera() {
            addLog(`🎥 Requesting camera permissions...`);
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' }
                });
                video.srcObject = stream;
                await video.play();
                addLog(`✅ Camera stream connected (640x480)`);
                statusEl.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg> Searching for face...';
                startScanning();
            } catch (err) {
                console.error('Camera access error:', err);
                addLog(`❌ Camera error: ${err.message}`, 'error');
                showError(`Camera access permission issue: ${err.message}`);
            }
        }

        function captureFrame() {
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            return new Promise(resolve => {
                canvas.toBlob(resolve, 'image/jpeg', 0.9);
            });
        }

        async function sendFrame() {
            if (isProcessing || matchFound) return;
            isProcessing = true;

            const blob = await captureFrame();
            const formData = new FormData();
            formData.append('image', blob, 'frame.jpg');

            try {
                const response = await fetch(`${API_BASE_URL}/process_frame`, {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                totalChecks++;

                if (result.status === 'matched') {
                    scanOverlay.classList.remove('error');
                    scanOverlay.classList.add('active');
                    noFaceCount = 0;
                    voteCounter[result.student_id] = (voteCounter[result.student_id] || 0) + 1;
                    const votes = voteCounter[result.student_id] || 0;
                    statusEl.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg> Match: ${result.name} (${votes}/2)`;
                    addLog(`🟢 Face Matched: ${result.name} (ID: ${result.student_id}) [Votes: ${votes}/2]`, 'success');

                    if (votes >= 1) {
                        matchFound = true;
                        if (frameInterval) clearInterval(frameInterval);
                        addLog(`🎉 Face verified for ${result.name}! Marking attendance...`, 'success');
                        markAttendance(result.student_id, result.name, result.confidence);
                        return;
                    }
                } else if (result.status === 'no_face') {
                    scanOverlay.classList.remove('active', 'error');
                    noFaceCount++;
                    if (noFaceCount % 3 === 0) {
                        addLog(`🟡 No face detected in frame. Please face straight to camera.`, 'warn');
                    }
                } else if (result.status === 'removed') {
                    scanOverlay.classList.remove('active');
                    scanOverlay.classList.add('error');
                    addLog(`🔴 Removed face detected! Attendance blocked.`, 'error');
                    showError("Face matches a removed student record.");
                } else if (result.status === 'error') {
                    scanOverlay.classList.remove('active', 'error');
                    addLog(`⚠️ Backend response error: ${result.message}`, 'error');
                    showError(result.message);
                } else {
                    scanOverlay.classList.remove('active', 'error');
                }
            } catch (err) {
                console.error('Frame processing error:', err);
                addLog(`❌ Backend connection issue: ${err.message}`, 'error');
                showError(`Render Backend connection issue: ${err.message}`);
            } finally {
                isProcessing = false;
            }
        }

        async function markAttendance(studentId, name, confidence) {
            isProcessing = true;
            cameraStage.classList.add('processing');
            overlayEl.style.display = 'grid';
            if (stream) stream.getTracks().forEach(t => t.stop());

            try {
                const response = await fetch(`${API_BASE_URL}/mark_attendance_ajax`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        student_id: studentId,
                        name: name,
                        confidence: confidence
                    })
                });
                const result = await response.json();

                if (result.success) {
                    addLog(`✅ Attendance marked successfully for ${name}!`, 'success');
                    window.location.href = `result.html?success=1&title=Attendance&message=${encodeURIComponent(result.message)}`;
                } else {
                    addLog(`❌ Attendance failed: ${result.message}`, 'error');
                    window.location.href = `result.html?success=0&title=Attendance&message=${encodeURIComponent(result.message)}`;
                }
            } catch (err) {
                addLog(`❌ Attendance API call error: ${err.message}`, 'error');
                window.location.href = `result.html?success=0&title=Attendance&message=${encodeURIComponent('An error occurred while marking attendance.')}`;
            }
        }

        function startScanning() {
            countdownEl.textContent = secondsLeft;
            frameInterval = setInterval(async () => {
                if (matchFound) {
                    clearInterval(frameInterval);
                    return;
                }
                await sendFrame();
                secondsLeft--;
                countdownEl.textContent = Math.max(0, secondsLeft);

                if (secondsLeft <= 0) {
                    clearInterval(frameInterval);
                    if (!matchFound) {
                        if (stream) stream.getTracks().forEach(t => t.stop());
                        addLog(`⏱️ Scanning timed out (10s limit reached)`, 'warn');
                        window.location.href = `result.html?success=0&title=Attendance&message=${encodeURIComponent('Face match failed. Unrecognized face. Please try again with better lighting.')}`;
                    }
                }
            }, 800);
        }

        startCamera();
    </script>
</body>
</html>
